    <rect x="2.5" y="2.5" width="227" height="479" rx="34" fill="url(#sheen-cosmic-orange)" opacity="0.8" />
    
      <rect x="4" y="4" width="224" height="180" rx="32" fill="url(#plateau-cosmic-orange)" stroke="#80411a" stroke-opacity="0.35" />
      
    <circle cx="66" cy="60" r="33" fill="#ba5f26" />
    <circle cx="66" cy="60" r="30" fill="url(#lensRing-cosmic-orange)" />
