<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="body-cosmic-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1a778" />
      <stop offset="0.55" stop-color="#E9772F" />
      <stop offset="1" stop-color="#a35321" />
    </linearGradient>
    <linearGradient id="plateau-cosmic-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3b48d" />
      <stop offset="1" stop-color="#E9772F" />
    </linearGradient>
    <linearGradient id="sheen-cosmic-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="lensRing-cosmic-orange" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5b5e66" />
      <stop offset="1" stop-color="#16171b" />
    </radialGradient>
    <radialGradient id="lensGlass-cosmic-orange" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3d4f7a" />
      <stop offset="0.6" stop-color="#151a2b" />
      <stop offset="1" stop-color="#05060a" />
    </radialGradient>
    <linearGradient id="wall-cosmic-orange" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ec8b4e" />
      <stop offset="1" stop-color="#d36d2e" />
    </linearGradient>
    <radialGradient id="blob-cosmic-orange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <clipPath id="screen-cosmic-orange"><rect x="9" y="9" width="214" height="466" rx="28" /></clipPath>
  </defs>

  <ellipse cx="330" cy="590" rx="210" ry="18" fill="#000" opacity="0.22" filter="url(#shadow)" />

  <!-- front -->
  <g transform="translate(318 46) rotate(7 116 242)">
    <rect width="232" height="484" rx="36" fill="#80411a" />
    <rect x="2.5" y="2.5" width="227" height="479" rx="34" fill="#0a0a0c" />
    <g clip-path="url(#screen-cosmic-orange)">
      <rect x="9" y="9" width="214" height="466" fill="url(#wall-cosmic-orange)" />
      <circle cx="60" cy="150" r="130" fill="url(#blob-cosmic-orange)" />
      <circle cx="200" cy="380" r="110" fill="#f4bb97" opacity="0.35" />
      <rect x="40" y="90" width="80" height="10" rx="5" fill="#fff" opacity="0.85" />
      <rect x="40" y="108" width="52" height="6" rx="3" fill="#fff" opacity="0.55" />
    </g>
    <rect x="82" y="22" width="68" height="20" rx="10" fill="#050505" />
  </g>

