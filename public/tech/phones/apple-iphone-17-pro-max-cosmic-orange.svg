    <circle cx="66" cy="60" r="12.6" fill="url(#lensGlass-cosmic-orange)" />
    <circle cx="59.4" cy="52.8" r="3.9000000000000004" fill="#ffffff" opacity="0.55" />
      
    <circle cx="66" cy="136" r="33" fill="#ba5f26" />
    <circle cx="66" cy="136" r="30" fill="url(#lensRing-cosmic-orange)" />
    <circle cx="66" cy="136" r="20.400000000000002" fill="#0b0c10" />
    <circle cx="66" cy="136" r="12.6" fill="url(#lensGlass-cosmic-orange)" />
    <circle cx="59.4" cy="128.8" r="3.9000000000000004" fill="#ffffff" opacity="0.55" />
      
    <circle cx="132" cy="98" r="33" fill="#ba5f26" />
    <circle cx="132" cy="98" r="30" fill="url(#lensRing-cosmic-orange)" />
    <circle cx="132" cy="98" r="20.400000000000002" fill="#0b0c10" />
    <circle cx="132" cy="98" r="12.6" fill="url(#lensGlass-cosmic-orange)" />
    <circle cx="125.4" cy="90.8" r="3.9000000000000004" fill="#ffffff" opacity="0.55" />
      <circle cx="190" cy="60" r="10" fill="#fdf6e3" stroke="#80411a" stroke-width="1.5" />
